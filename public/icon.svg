<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0c1e42"/>
      <stop offset="100%" stop-color="#03080f"/>
    </radialGradient>
    <linearGradient id="body" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="42%" stop-color="#6a96cc"/>
      <stop offset="100%" stop-color="#1e4a88"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0d8f8"/>
      <stop offset="100%" stop-color="#3060a0"/>
    </linearGradient>
    <radialGradient id="eng" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffdd44"/>
      <stop offset="38%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#cc1100" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle atmosphere glow at top -->
  <ellipse cx="256" cy="0" rx="280" ry="120" fill="#1a4080" opacity="0.25"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="72"  cy="56"  r="1.8" opacity="0.62"/>
    <circle cx="152" cy="36"  r="1.1" opacity="0.48"/>
    <circle cx="396" cy="62"  r="2.0" opacity="0.58"/>
    <circle cx="454" cy="116" r="1.4" opacity="0.38"/>
    <circle cx="42"  cy="198" r="1.1" opacity="0.42"/>
    <circle cx="478" cy="234" r="1.8" opacity="0.52"/>
    <circle cx="90"  cy="390" r="1.1" opacity="0.36"/>
    <circle cx="432" cy="414" r="1.5" opacity="0.46"/>
    <circle cx="314" cy="454" r="1.0" opacity="0.32"/>
    <circle cx="176" cy="464" r="1.2" opacity="0.38"/>
    <circle cx="338" cy="148" r="0.9" opacity="0.40"/>
    <circle cx="118" cy="304" r="1.0" opacity="0.35"/>
    <circle cx="484" cy="360" r="1.2" opacity="0.42"/>
    <circle cx="28"  cy="310" r="0.9" opacity="0.34"/>
  </g>

  <!-- Engine exhaust glow (soft, behind aircraft) -->
  <ellipse cx="230" cy="415" rx="32" ry="38" fill="#ff5500" filter="url(#softglow)" opacity="0.7"/>
  <ellipse cx="282" cy="415" rx="32" ry="38" fill="#ff5500" filter="url(#softglow)" opacity="0.7"/>
  <ellipse cx="256" cy="420" rx="80" ry="52" fill="#ff3300" opacity="0.10"/>

  <!-- Aircraft: delta-wing fighter, top-down, nose pointing up -->
  <!-- Wings -->
  <path d="
    M 268,186 L 440,298 C 428,314 408,320 386,312 L 284,272 Z
  " fill="url(#wing)" opacity="0.95"/>
  <path d="
    M 244,186 L 72,298 C 84,314 104,320 126,312 L 228,272 Z
  " fill="url(#wing)" opacity="0.95"/>

  <!-- Horizontal stabilizers -->
  <path d="M 284,348 L 322,384 C 312,390 298,388 288,380 L 280,358 Z" fill="url(#wing)" opacity="0.9"/>
  <path d="M 228,348 L 190,384 C 200,390 214,388 224,380 L 232,358 Z" fill="url(#wing)" opacity="0.9"/>

  <!-- Main fuselage -->
  <path d="
    M 256,74
    C 261,108 270,152 274,192
    L 290,272 L 296,352 L 316,375
    C 308,384 294,386 280,380
    L 268,360 L 268,422
    C 262,428 250,428 244,422
    L 244,360 L 232,380
    C 218,386 204,384 196,375
    L 216,352 L 222,272 L 238,192
    C 242,152 251,108 256,74
    Z
  " fill="url(#body)"/>

  <!-- Center spine highlight -->
  <line x1="256" y1="82" x2="256" y2="418" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-linecap="round"/>

  <!-- Wing leading edge reflections -->
  <path d="M 258,82 L 432,294" stroke="rgba(220,240,255,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 254,82 L 80,294"  stroke="rgba(220,240,255,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cockpit canopy -->
  <ellipse cx="256" cy="158" rx="14" ry="26" fill="#2255aa" opacity="0.5"/>
  <ellipse cx="256" cy="153" rx="9"  ry="18" fill="#88bbff" opacity="0.7"/>
  <ellipse cx="253" cy="147" rx="4"  ry="8"  fill="white"   opacity="0.45"/>

  <!-- Engine nozzle rings -->
  <ellipse cx="230" cy="396" rx="17" ry="13" fill="#06101e"/>
  <ellipse cx="282" cy="396" rx="17" ry="13" fill="#06101e"/>
  <!-- Glow fill -->
  <ellipse cx="230" cy="396" rx="13" ry="9"  fill="url(#eng)"/>
  <ellipse cx="282" cy="396" rx="13" ry="9"  fill="url(#eng)"/>
  <!-- Hot core -->
  <ellipse cx="230" cy="395" rx="7"  ry="5"  fill="#ffee88"/>
  <ellipse cx="282" cy="395" rx="7"  ry="5"  fill="#ffee88"/>

  <!-- Wing tip missiles -->
  <g fill="#7a8fb0">
    <rect x="64"  y="290" width="26" height="7" rx="3.5"/>
    <rect x="422" y="290" width="26" height="7" rx="3.5"/>
  </g>
  <!-- Missile tips -->
  <g stroke="#aabbcc" stroke-width="2.5" stroke-linecap="round">
    <line x1="65"  y1="293.5" x2="58"  y2="293.5"/>
    <line x1="447" y1="293.5" x2="454" y2="293.5"/>
  </g>

  <!-- Cyan accent: targeting reticle hint in corner -->
  <circle cx="420" cy="90" r="22" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="420" cy="90" r="3"  fill="#00ccff" opacity="0.5"/>
  <line x1="420" y1="65"  x2="420" y2="74"  stroke="#00ccff" stroke-width="1.5" opacity="0.4"/>
  <line x1="420" y1="106" x2="420" y2="115" stroke="#00ccff" stroke-width="1.5" opacity="0.4"/>
  <line x1="395" y1="90"  x2="404" y2="90"  stroke="#00ccff" stroke-width="1.5" opacity="0.4"/>
  <line x1="436" y1="90"  x2="445" y2="90"  stroke="#00ccff" stroke-width="1.5" opacity="0.4"/>
</svg>

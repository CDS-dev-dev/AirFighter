<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirFighter</title>
    <link rel="manifest" href="/AirFighter/manifest.json">
    <link rel="apple-touch-icon" href="/AirFighter/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AirFighter">
    <meta name="theme-color" content="#0c1e42">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }

      /* ── ガラスパネル共通 ── */
      .hud-panel {
        position: fixed;
        background: rgba(10, 20, 35, 0.55);
        border: 1px solid rgba(160, 220, 255, 0.18);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        pointer-events: none;
        color: #e8f4ff;
      }

      /* ── 左下：飛行データ ── */
      #hud-flight {
        bottom: 28px; left: 24px;
        padding: 12px 18px;
        min-width: 160px;
      }
      #hud-flight .row { display: flex; align-items: baseline; gap: 6px; line-height: 2.1; }
      #hud-flight .label { font-size: 10px; letter-spacing: 2px; color: rgba(160,220,255,0.6); width: 34px; }
      #hud-flight .val   { font-size: 22px; font-weight: 300; letter-spacing: 1px; color: #fff; }
      #hud-flight .unit  { font-size: 10px; color: rgba(200,235,255,0.5); }

      /* ── 右下：兵装 ── */
      #hud-weapons {
        bottom: 28px; right: 24px;
        padding: 12px 18px;
        min-width: 140px;
        text-align: right;
      }
      #hud-weapons .row  { display: flex; align-items: center; justify-content: flex-end; gap: 8px; line-height: 2.1; }
      #hud-weapons .label { font-size: 10px; letter-spacing: 2px; color: rgba(160,220,255,0.6); }
      #hud-weapons .pips  { display: flex; gap: 3px; }
      #hud-weapons .pip   { width: 8px; height: 8px; border-radius: 2px; background: rgba(255,255,255,0.2); transition: background 0.15s; }
      #hud-weapons .pip.on { background: #4cf; box-shadow: 0 0 5px #4cf; }
      #hud-weapons .pip.flare-on { background: #fa0; box-shadow: 0 0 5px #fa0; }

      /* ── 右上：スコア ── */
      #hud-score {
        top: 20px; right: 24px;
        padding: 10px 16px;
        text-align: right;
      }
      #hud-score .score-val { font-size: 28px; font-weight: 200; letter-spacing: 3px; color: #fff; }
      #hud-score .score-lbl { font-size: 9px; letter-spacing: 3px; color: rgba(160,220,255,0.5); margin-bottom: 2px; }
      #hud-score .lives     { font-size: 14px; margin-top: 4px; letter-spacing: 2px; }

      /* ── ミサイル警告 ── */
      #warning {
        position: fixed; top: 18%; left: 50%;
        transform: translateX(-50%);
        pointer-events: none; display: none;
        text-align: center;
      }
      #warning .warn-text {
        font-size: 13px; font-weight: 700; letter-spacing: 5px;
        color: #ff4400; text-shadow: 0 0 16px #ff2200;
        padding: 6px 20px;
        border: 1px solid rgba(255,60,0,0.5);
        border-radius: 4px;
        background: rgba(255,30,0,0.08);
        backdrop-filter: blur(2px);
      }

      /* ── ヒットフラッシュ ── */
      #hit-overlay {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,0.5) 100%);
        pointer-events: none; opacity: 0;
      }

      /* ── ロックオン照準 ── */
      #reticle {
        position: fixed; width: 56px; height: 56px;
        pointer-events: none; display: none;
        transform: translate(-50%, -50%);
      }
      #reticle .arc {
        position: absolute; inset: 0;
        border: 1.5px solid #0f0;
        border-radius: 50%;
        border-top-color: transparent;
        border-bottom-color: transparent;
        animation: reticle-spin 1.8s linear infinite;
      }
      #reticle .arc2 {
        position: absolute; inset: 8px;
        border: 1.5px solid rgba(0,255,60,0.45);
        border-radius: 50%;
        border-left-color: transparent;
        border-right-color: transparent;
        animation: reticle-spin 1.2s linear infinite reverse;
      }
      #reticle .dot {
        position: absolute; top: 50%; left: 50%;
        width: 4px; height: 4px; border-radius: 50%;
        background: #0f0; transform: translate(-50%, -50%);
        box-shadow: 0 0 6px #0f0;
      }
      #reticle span {
        position: absolute; bottom: -20px; left: 50%;
        transform: translateX(-50%); color: #0f0;
        font-size: 9px; font-family: monospace; letter-spacing: 2px; white-space: nowrap;
      }
      @keyframes reticle-spin { to { transform: rotate(360deg); } }

      /* ── 操作ガイド ── */
      #controls {
        position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
        color: rgba(200,230,255,0.3); font-size: 10px; letter-spacing: 1px;
        text-align: center; pointer-events: none; white-space: nowrap;
      }

      /* ── ブースト表示 ── */
      #boost-bar {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        width: 120px; height: 3px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px; pointer-events: none;
        overflow: hidden;
      }
      #boost-fill {
        height: 100%; width: 100%;
        background: linear-gradient(90deg, #4cf, #0af);
        border-radius: 2px;
        transition: width 0.1s;
        box-shadow: 0 0 6px #4cf;
      }

      /* ── レーダー ── */
      #radar-wrap {
        position: fixed; top: 150px; right: 24px;
        pointer-events: none;
      }
      #radar { border-radius: 50%; opacity: 0.88; }

      /* ── HP バー ── */
      .hp-bar {
        width: 100%; height: 5px;
        background: rgba(255,255,255,0.12);
        border-radius: 3px; margin-top: 6px; overflow: hidden;
      }
      .hp-fill {
        height: 100%; background: linear-gradient(90deg, #f44, #f80);
        border-radius: 3px; transition: width 0.25s;
      }

      /* ── リスポーン演出 ── */
      #respawn-overlay {
        position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(100,200,255,0.15) 0%, rgba(0,100,255,0.4) 100%);
      }

      /* ── 補給インジケーター ── */
      #supply-indicator {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
        pointer-events: none; display: none; text-align: center;
        color: rgba(0,255,136,0.9); font-size: 13px; font-weight: 700;
        letter-spacing: 4px; text-shadow: 0 0 16px rgba(0,255,100,0.7);
        padding: 8px 24px; border: 1px solid rgba(0,255,100,0.4);
        border-radius: 4px; background: rgba(0,30,15,0.6); backdrop-filter: blur(4px);
      }

      /* ── タッチコントロール（横画面専用） ── */
      #touch-controls {
        position: fixed; inset: 0;
        pointer-events: none; display: none; z-index: 100;
      }
      @media (pointer: coarse) { #touch-controls { display: block; } }

      /* 左半分全体がジョイスティックゾーン */
      #joystick-zone {
        position: absolute; left: 0; top: 0; width: 50%; height: 100%;
        pointer-events: all; touch-action: none; z-index: 101;
      }
      #joystick-base {
        position: absolute; width: 110px; height: 110px;
        margin-left: -55px; margin-top: -55px; border-radius: 50%;
        border: 2px solid rgba(160,220,255,0.38); background: rgba(10,20,40,0.22);
        pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 102;
      }
      #joystick-knob {
        position: absolute; width: 44px; height: 44px;
        margin-left: -22px; margin-top: -22px; border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, rgba(210,240,255,0.92), rgba(70,150,235,0.65));
        border: 1.5px solid rgba(160,220,255,0.72);
        box-shadow: 0 0 14px rgba(100,200,255,0.48);
        pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 102;
      }

      /* ボタン共通 */
      .tbtn {
        border-radius: 12px; background: rgba(10,20,35,0.60);
        border: 1.5px solid rgba(160,220,255,0.22); color: rgba(200,235,255,0.85);
        font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(6px);
        touch-action: none; user-select: none; -webkit-user-select: none;
        transition: background 0.08s, box-shadow 0.08s;
        pointer-events: all; z-index: 103;
      }

      /* 左上：BOOST（左手人差し指） */
      #btn-boost {
        position: absolute; top: 14px; left: 14px; width: 82px; height: 52px;
        border-color: rgba(100,200,255,0.40); color: rgba(100,220,255,0.92);
      }
      #btn-boost.pressed { background: rgba(20,80,140,0.72); box-shadow: 0 0 18px rgba(60,180,255,0.55); }

      /* 右上：LOCK */
      #btn-lock {
        position: absolute; top: 14px; right: 14px; width: 82px; height: 52px;
        border-color: rgba(50,230,80,0.38); color: rgba(62,255,92,0.95);
      }
      #btn-lock.pressed { background: rgba(10,62,20,0.72); box-shadow: 0 0 14px rgba(0,230,62,0.50); }

      /* 左下：GUN FLR MSL 横並び */
      #touch-combat {
        position: absolute; bottom: 14px; left: 14px;
        display: flex; gap: 8px; z-index: 103;
      }
      #touch-combat .tbtn { width: 70px; height: 58px; }

      #btn-gun { border-color: rgba(255,200,60,0.38); color: rgba(255,205,65,0.95); }
      #btn-gun.pressed { background: rgba(80,50,8,0.72);  box-shadow: 0 0 12px rgba(255,185,0,0.50); }
      #btn-flr { border-color: rgba(255,160,30,0.38); color: rgba(255,168,52,0.95); }
      #btn-flr.pressed { background: rgba(80,46,5,0.72);  box-shadow: 0 0 12px rgba(255,142,0,0.45); }
      #btn-msl { border-color: rgba(255,80,40,0.38);  color: rgba(255,100,62,0.95); }
      #btn-msl.pressed { background: rgba(80,20,8,0.72);  box-shadow: 0 0 12px rgba(255,80,0,0.50); }

      @media (pointer: coarse) { #controls { display: none; } }

      /* 縦画面：回転促進オーバーレイ */
      #rotate-hint {
        display: none; position: fixed; inset: 0;
        background: rgba(3,8,15,0.96); z-index: 999;
        flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        color: rgba(160,220,255,0.85); font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #rotate-hint .ri-icon { font-size: 54px; animation: ri-spin 2.2s ease-in-out infinite; }
      #rotate-hint .ri-text { font-size: 13px; letter-spacing: 3px; }
      @keyframes ri-spin {
        0%, 35% { transform: rotate(0deg); } 65%, 100% { transform: rotate(90deg); }
      }
      @media (pointer: coarse) and (orientation: portrait) { #rotate-hint { display: flex; } }
    </style>
  </head>
  <body>
    <div id="hit-overlay"></div>

    <div id="warning">
      <div class="warn-text">&#9651; MISSILE INCOMING &#9651;</div>
    </div>

    <div id="reticle">
      <div class="arc"></div>
      <div class="arc2"></div>
      <div class="dot"></div>
      <span>LOCK</span>
    </div>

    <!-- 飛行データ (左下) -->
    <div class="hud-panel" id="hud-flight">
      <div class="row">
        <span class="label">SPD</span>
        <span class="val" id="speed">0</span>
        <span class="unit">km/h</span>
      </div>
      <div class="row">
        <span class="label">ALT</span>
        <span class="val" id="altitude">0</span>
        <span class="unit">m</span>
      </div>
    </div>

    <!-- 兵装 (右下) -->
    <div class="hud-panel" id="hud-weapons">
      <div class="row">
        <span class="label">MSL</span>
        <div class="pips" id="missile-pips"></div>
      </div>
      <div class="row">
        <span class="label">FLR</span>
        <div class="pips" id="flare-pips"></div>
      </div>
      <!-- JS参照用 (非表示) -->
      <span id="missiles" style="display:none">6</span>
      <span id="flares"   style="display:none">8</span>
    </div>

    <!-- スコア (右上) -->
    <div class="hud-panel" id="hud-score">
      <div class="score-lbl">SCORE</div>
      <div class="score-val" id="score">0</div>
      <div class="hp-bar"><div class="hp-fill" id="hp-fill" style="width:100%"></div></div>
      <div style="font-size:9px;letter-spacing:2px;color:rgba(255,150,100,0.6);margin-top:3px" id="hp-text">HP 3/3</div>
    </div>

    <!-- ブーストバー (下中央) -->
    <div id="boost-bar"><div id="boost-fill"></div></div>

    <div id="controls">W/S · A/D · SPACE boost · Z gun · X missile · C flare · TAB lock</div>

    <!-- タッチコントロール -->
    <div id="touch-controls">
      <div id="joystick-zone"></div>
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
      <!-- 左上：BOOST（左手人差し指） -->
      <div class="tbtn" id="btn-boost">BOOST</div>
      <!-- 右上：LOCK -->
      <div class="tbtn" id="btn-lock">LOCK</div>
      <!-- 左下：戦闘ボタン -->
      <div id="touch-combat">
        <div class="tbtn" id="btn-gun">GUN</div>
        <div class="tbtn" id="btn-flr">FLR</div>
        <div class="tbtn" id="btn-msl">MSL</div>
      </div>
    </div>
    <!-- 縦画面メッセージ -->
    <div id="rotate-hint">
      <div class="ri-icon">&#8635;</div>
      <div class="ri-text">横画面にしてください</div>
    </div>

    <!-- レーダー -->
    <div id="radar-wrap">
      <canvas id="radar" width="160" height="160"></canvas>
    </div>
    <!-- 補給インジケーター -->
    <div id="supply-indicator">RESUPPLY</div>
    <!-- リスポーン演出 -->
    <div id="respawn-overlay"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
